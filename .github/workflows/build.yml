name: Build

on:
  push:
    branches:
      - main
      - main
      - master
      - "improvements/**"
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check CMake Version
        run: cmake --version

      - name: Setup Dependencies
        shell: pwsh
        run: ./scripts/setup-deps.ps1

      - name: Generate obs.lib
        run: ./scripts/generate-lib.ps1
        shell: pwsh

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
        env:
          # Placeholder: user would need to set CMAKE_PREFIX_PATH to where LibObsConfig.cmake is
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/obs-studio

      - name: Build
        run: cmake --build build --config RelWithDebInfo
